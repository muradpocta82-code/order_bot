<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Каталог — заказ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#14161a; --card:#1e2128; --line:#2b2f38; --text:#e9ecf1; --muted:#8d95a3; --accent:#2f8f5b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:96px; }
  header { position:sticky; top:0; background:var(--bg); padding:10px 14px 8px; border-bottom:1px solid var(--line); z-index:5; }
  h1 { font-size:17px; margin:0 0 8px; font-weight:600; }
  input[type=search] { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; }
  .list { padding:8px 10px; }
  .item { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0; }
  .item .name { flex:1; }
  .item .price { color:var(--muted); font-size:13px; margin-top:2px; }
  .stepper { display:flex; align-items:center; gap:6px; }
  .stepper button { width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:#262a33; color:var(--text); font-size:18px; line-height:1; }
  .stepper span { min-width:26px; text-align:center; font-variant-numeric:tabular-nums; }
  .cart { position:fixed; left:0; right:0; bottom:0; background:#191c22; border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:12px; align-items:center; }
  .cart .sum { flex:1; font-size:14px; color:var(--muted); }
  .cart .sum b { display:block; font-size:18px; color:var(--text); }
  .send { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:13px 18px; font-size:15px; font-weight:600; }
  .send:disabled { opacity:.45; }
  .empty { color:var(--muted); text-align:center; padding:30px 20px; }
  .note { padding:0 14px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Каталог</h1>
  <input id="q" type="search" placeholder="Поиск: филе, сыр, томаты…" autocomplete="off">
</header>
<div class="note" id="note"></div>
<div class="list" id="list"></div>
<div class="cart">
  <div class="sum"><span id="count">0 позиций</span><b id="total">0.00 USD</b></div>
  <button class="send" id="send" disabled>Отправить заказ</button>
</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const state = { items: [], cart: new Map(), filter: "" };

function money(v) { return v.toFixed(2) + " USD"; }

function render() {
  const list = document.getElementById("list");
  const q = state.filter.trim().toLowerCase();
  const rows = state.items.filter(it => !q || it.name.toLowerCase().includes(q));
  if (!rows.length) {
    list.innerHTML = '<div class="empty">Ничего не найдено</div>';
  } else {
    list.innerHTML = rows.map(it => {
      const qty = state.cart.get(it.id) || 0;
      return `<div class="item">
        <div class="name"><div>${it.name}</div><div class="price">${it.price.toFixed(2)} USD / ${it.unit}</div></div>
        <div class="stepper">
          <button data-dec="${it.id}">−</button><span>${qty}</span><button data-inc="${it.id}">+</button>
        </div>
      </div>`;
    }).join("");
  }
  renderCart();
}

function renderCart() {
  let count = 0, sum = 0;
  for (const [id, qty] of state.cart) {
    const it = state.items.find(x => x.id === id);
    if (!it) continue;
    count += qty; sum += qty * it.price;
  }
  document.getElementById("count").textContent = count ? count + " поз." : "Корзина пуста";
  document.getElementById("total").textContent = money(sum);
  document.getElementById("send").disabled = !count;
}

document.addEventListener("click", e => {
  const inc = e.target.dataset?.inc, dec = e.target.dataset?.dec;
  if (!inc && !dec) return;
  const id = parseInt(inc || dec, 10);
  const cur = state.cart.get(id) || 0;
  const next = Math.max(0, cur + (inc ? 1 : -1));
  if (next === 0) state.cart.delete(id); else state.cart.set(id, next);
  render();
});

document.getElementById("q").addEventListener("input", e => {
  state.filter = e.target.value; render();
});

document.getElementById("send").addEventListener("click", () => {
  const lines = [];
  for (const [id, qty] of state.cart) {
    const it = state.items.find(x => x.id === id);
    if (it) lines.push(`${qty} ${it.unit} ${it.name}`);
  }
  const payload = { initData: tg ? tg.initData : "", items: lines.join(", ") };
  fetch("/api/order", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  })
    .then(res => {
      if (!res.ok) throw new Error("не принят");
      if (tg) { tg.showAlert("Заказ отправлен боту"); tg.close(); }
      else { alert("Заказ отправлен боту"); }
    })
    .catch(() => {
      if (tg) tg.showAlert("Не удалось отправить заказ, попробуйте ещё раз");
      else alert("Не удалось отправить заказ");
    });
});

async function load() {
  const note = document.getElementById("note");
  try {
    const initData = tg ? tg.initData : "";
    const res = await fetch("/api/catalog", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    state.items = data.items;
    note.textContent = `Позиций: ${data.items.length}. Цены в USD.`;
    render();
  } catch (err) {
    note.textContent = "Не удалось загрузить каталог: " + err.message;
  }
}
load();
</script>
</body>
</html>
